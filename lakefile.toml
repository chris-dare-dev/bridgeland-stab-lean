name = "BridgelandStabLean"
version = "0.1.0"
defaultTargets = ["BridgelandStabLean", "Audit"]
keywords = ["math"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

# The anchor library. Pinned to an exact commit, never a branch: the whole
# point of this repo is that its environment is reproducible and citable.
# 9e48f23 (2026-04-21) is the commit audited in formalization.yaml; it in turn
# pins Mathlib 8a178386ffc0f5fef0b77738bb5449d50efeea95 (= tag v4.29.0), which
# is where our Mathlib comes from transitively. Do not add a direct Mathlib
# require -- a second pin is a second thing to drift.
[[require]]
name = "BridgelandStability"
git = "https://github.com/mattrobball/BridgelandStability"
rev = "9e48f23a382ba117b63076a33e0e775389fef1ba"

# The SECOND pin, and the comment above says a second pin is a second thing to
# drift. It is here as the NAMED EXCEPTION recorded in .claude/decisions/
# ADR-0008, not as a change of mind, and the exception is argued from one
# property: this package is a LEAF. Its lakefile carries the line "NO
# `[[require]]` BLOCKS. NOT ONE. EVER.", enforced by a `no-dependencies` CI job
# on that side, and it pins the same toolchain we do (v4.29.0). It therefore
# cannot drag anything into this environment and cannot disagree with the
# anchor about a Mathlib revision.
#
# Vendoring was not the safer option; it was not an option. `@[cites]` is a
# `SimplePersistentEnvExtension` and duplicate attribute registration is an
# import-time error, so two vendored topic repos could never coexist in one
# Lean environment.
#
# IF IT EVER GROWS A DEPENDENCY, THE EXCEPTION LAPSES and this block comes out.
# It is not grandfathered.
[[require]]
name = "MathFormalContract"
git = "https://github.com/chris-dare-dev/math-formal-contract-lean"
rev = "2d9c2d1cbba88f65ed29705492ac017bd8ad4b68"

[[lean_lib]]
name = "BridgelandStabLean"

# The axiom audit, as a build target rather than a file someone remembers to
# run. Covered by no lean_lib until 2026-08-03, so `lake build` never touched
# it and it could fall behind the source tree silently.
#
# This makes it fail to BUILD when a name it prints no longer exists. It does
# NOT make it a gate: `#print axioms` prints `[sorryAx]` and exits 0, so a
# sorry-backed declaration still builds green here. The gate is the emitter
# (contract-v1-e4), which sweeps `Environment.constants` instead of listing
# names by hand.
[[lean_lib]]
name = "Audit"
srcDir = "scripts"
