notes: >
  v0 skeleton. No mathematical claim in this repo has had human faithfulness
  review. Typechecking is not fidelity: the reference figure is
  TheoremGraph's statement-only experiment, where 22/24 outputs typechecked
  and 5/24 were semantically faithful. Nothing here should be cited as a
  formalization of any paper result until the human_review field says
  otherwise.
