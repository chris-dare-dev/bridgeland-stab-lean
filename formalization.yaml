    COUNTS ARE PINNED TO A COMMIT, deliberately. This repo moved five times on
    2026-08-03 alone (58359e1 -> 5b40d5a) and the count went 15 -> 43 -> 77 ->
    90 -> 105 -> 111 in that span, so a bare number here is stale on arrival
    and two fields quoting different bare numbers is the normal failure, not an
    unlucky one. Quote the commit with the count, or do not quote the count.
  builds_clean: true
  builds_clean_date: 2026-08-04
  builds_clean_note: >
    Observed on a SECOND machine on 2026-08-04 -- macOS/aarch64, toolchain
    installed from scratch, Mathlib from `lake exe cache get`, the anchor
    compiled from source -- at 3548 jobs, exit 0, zero errors and zero sorry
    warnings. The 2026-08-03 observation was on the Windows 11 workstation
    recorded under environment.hardware. Two machines is not CI, and this field
    still describes observations rather than a gate.
  human_review: none
  machine_review: >
    lake build at commit 5b40d5a (3547 jobs, exit 0). Since 2026-08-03 the
    #print axioms pass is
    a BUILD TARGET, not a separate manual step: scripts/Audit.lean is covered
    by `[[lean_lib]] name = "Audit"` (srcDir = "scripts") and is in
    defaultTargets, so `lake build` elaborates it and its 111 audit records are
    build output. The anchor itself was also built from source for the first
    time (74 files, exit 0) -- it is not covered by Mathlib's cache and nothing
    had imported it until the step-3 API read.

    All 118 records were re-parsed from the build log at 5b40d5a and every one
    is a subset of [propext, Classical.choice, Quot.sound]; the distinct axiom
    set across all 111 is exactly those three; sorryAx does not appear anywhere
    in the log.

    HOW TO PARSE THIS OUTPUT, because the two obvious ways are both WRONG. The
    axiom list wraps across lines, so a line-oriented grep under-reads it; and
    the declaration name is quote-delimited while some names END in an
    apostrophe (NormalizedShift.ext', GLTilde.ext'), so a naive quoted-name
    regex silently drops exactly those. Both were hit for real on 2026-08-03,
    when the then-current 90 records parsed as 88 and the missing two were the
    primed names -- a checker that reports 88 of 90 and calls it clean is the
    failure mode to watch for. This is a symptom, not a
    quirk: prose output is the wrong interface, which is why the emitter
    (contract-v1-e4) replaces it with JSON.

    Bringing the audit into the build immediately caught rot the manual
    workflow could not: the SlicingChecks section did not compile under this
    package's own `[leanOptions] autoImplicit = false`. It had only ever been
    run via `lake env lean`, which does not apply the package's leanOptions, so
    the universe variables `u` and `v` were auto-bound and the section
    elaborated by accident. Fixed by an explicit `universe u v`.

    Being in the build is still NOT a gate. `#print axioms` prints its result
    and exits 0, so a sorryAx-backed declaration would build green here; the
    allowlist verdict above comes from reading the output, not from the exit
    code. A real gate requires an emitter that sweeps Environment.constants
    (.claude/roadmap/contract-v1.yaml -> contract-v1-e4).

    No human has reviewed any statement for faithfulness to a source.
  source_mapping: >
    Lattice/ maps to no single paper section: it is the rank-2 torsion-free
    arithmetic underlying the Enriques-Kuznetsov article's section 8.4-8.6
    numerical steps. GroupAction/ targets Bridgeland 2007 section 8 (Lemma 8.2
    and the autoequivalence action). It now contains: NormalizedShift, the
    group of +1-equivariant order isomorphisms of R (step 1); and GLTilde,
    Bridgeland's concrete presentation of GL+(2,R)-tilde as pairs (T, f) of a
    positive-determinant matrix and a normalized shift agreeing on the circle
    of phases, proved to be a group under componentwise multiplication with
    both projections group homs (step 2); ComplexBridge, reconciling the
    anchor's C-valued central charge with GLTilde's action on Fin 2 -> R
    (step 3 groundwork); and SlicingAction, the MulAction of NormalizedShift
    (and hence of GLTilde, via toShiftHom) on the anchor's Slicing C by phase
    relabelling, with one_smul and mul_smul proved (step 3a); and
    PreStabilityAction, where BOTH factors act at once -- the shift relabels
    the slicing and the matrix transforms the central charge -- giving
    MulAction GLTilde (PreStabilityCondition.WithClassMap C v) with both laws
    proved (step 3b). The compat' obligation is what forces the two factors to
    agree, and it is discharged by Compatible: a semistable object's charge
    ray moves from phase f-inverse phi to phase phi, with the positive scalar
    m replaced by m * r. ShiftAnalysis proves a normalized shift is UNIFORMLY
    continuous (not automatic for a continuous bijection of R; it follows from
    map_add_one via integer translation and a modulus on a compact window),
    with exists_radius as the consumable form, and SlicingAction adds
    relabel_intervalProp: interval subcategories are reindexed exactly, as an
    equality of ObjectProperty. Those two, plus the anchor's own
    interval_thinFiniteLength_of_inclusion_strict, give relabel_isLocallyFinite
    and hence StabilityAction: MulAction GLTilde
    (StabilityCondition.WithClassMap C v), both laws proved (step 3c).

    The GL+(2,R)-tilde half of Bridgeland section 8 is therefore complete on
    stability conditions.

    AutAction, StrictAutAction, and QuotAutAction cover the other half of
    section 8 -- the autoequivalence action -- on SLICINGS only.

    AutAction is the groundwork: PostnikovTower.mapF and HNFiltration.mapF push
    a tower / filtration through a triangulated functor, and Slicing.mapEquiv
    transports a slicing along a triangulated auto-equivalence --
    (Phi . s).P phi X = s.P phi (Phi-inverse X), dual to relabel, which moves
    phases and fixes objects. The anchor has NO functor transport of its own,
    only HNFiltration.ofIso along an object isomorphism, so these are built
    from scratch.

    The packaging problem is that Aut(D) is not a group in Lean: C equiv C is
    associative only up to natural isomorphism, so it carries no Group instance
    and MulAction is unavailable. TWO answers are declared, and they are NOT
    interchangeable -- the difference is a scope claim, not a style choice.

    StrictAutAction takes a group mapping STRICTLY into endofunctors (functor
    composition in Lean is honestly associative, so C functor C is a monoid
    under composition), giving MulAction G (Slicing C) with no coherence
    bookkeeping. RESTRICTION, and it is a real one: map_one and map_mul are
    EQUALITIES of functors, so F g composed with F g-inverse is the identity on
    the nose -- each F g is an isomorphism of categories, not merely an
    equivalence. Serre functors and spherical twists satisfy that only up to
    natural isomorphism and are therefore OUT OF SCOPE, which is most of the
    autoequivalences one actually wants downstream. This was an explicit owner
    decision (2026-08-03) to take a strict subgroup rather than quotient. Do
    not cite StrictAut as "the Aut action is formalized".

    QuotAutAction does the general thing instead: TriEquiv bundles a
    triangulated auto-equivalence with its instances, and AutQuot C is the
    quotient by natural isomorphism -- a genuine Group, with
    MulAction (AutQuot C) (Slicing C) and both laws proved. NOTHING is
    excluded; every triangulated auto-equivalence has a class in it, Serre
    functors and spherical twists included. The action descends by act_congr:
    if Phi-inverse is naturally isomorphic to Psi-inverse then s.P phi
    (Phi-inverse X) and s.P phi (Psi-inverse X) are equivalent PROPOSITIONS,
    because a slicing's P is closed under isomorphism, and propext makes them
    equal. So closedUnderIso -- an axiom of Slicing that reads like bookkeeping
    -- is exactly what makes the quotient action well defined. One gap in the
    setoid is recorded in known_divergences.

    NOT declared on either route: the Aut action on STABILITY CONDITIONS. Of
    the three pieces that needs, one is now DONE and one is only a decision:

    K0Functor.lean supplies K0 functoriality -- K0.mapF for a triangulated
    functor, with mapF_id, mapF_comp, and mapF_congr (naturally isomorphic
    functors induce the SAME map, the K0-level analogue of TriEquiv.act_congr
    and what will let the class-map half descend to AutQuot). It was nearly
    free: X maps to the class of F X is triangle-additive because
    F.map_distinguished carries the triangle and mapTriangle's components are
    definitionally F applied to the originals.

    The class-map compatibility datum is a design choice, not a difficulty:
    pair the autoequivalence with an automorphism of Lambda commuting with v,
    structurally as Compatible does for GLTilde. Landed 2026-08-04 as
    AutPairAction.lean's AutPair/AutPairQuot; note the datum must be an
    AddEquiv there rather than the AddMonoidHom actStabAut takes, because a
    group needs its inverse and v supplies none.

    Landed 2026-08-03: StrictFiniteLength.lean extracts the general
    strict-hypothesis transfer lemma (isStrictArtinian_of_faithful_strict and
    its Noetherian twin) for an ARBITRARY full faithful strict-mono-preserving
    functor -- the anchor's own two interval lemmas are instances of it -- plus
    mapEquiv_intervalProp_iff, recording that under Aut the interval endpoints
    do NOT move. The anchor's own helpers are private, so they were replicated.
    What remains is only assembly: the induced interval functor, its
    strict-mono preservation (via the cokernel-triangle route, as
    intervalInclusion_map_strictMono does), and rebuilding IsLocallyFinite with
    the same eta.

    Formerly described as invariance of strict finite length under an
    EQUIVALENCE of interval categories -- a different problem from step 3c, where phase
    windows do not move and the anchor's
    interval_thinFiniteLength_of_inclusion_strict applies. The anchor's general
    transfer lemma isStrictArtinianObject_of_faithful_map_strictMono wants
    ORDINARY IsArtinianObject of the image, stronger than IsLocallyFinite
    gives; the strict-hypothesis versions exist only interval-specifically and
    each hand-rolls a roughly 70-line StrictSubobject order-embedding.
    Estimate: 150+ lines. Also not covered: the covering-space identification
    of GLTilde (see known_divergences). API mapped in
    notes/anchor-api-map.md.
  known_divergences: >
    Lattice/NumericalK.lean models K_num(Ku(X)) as the concrete lattice
    Fin 2 -> Z. Every lemma there is a theorem about a rank-2 torsion-free
    lattice, NOT about a Kuznetsov component. The identification is geometry,
    is not expressible in Mathlib today, and is tracked as an unrealized
    assumption -- never discharged in this repo.

    GroupAction/GLTilde.lean defines GLTilde as Bridgeland's pair
    presentation of GL+(2,R)-tilde and proves it is a GROUP. It does NOT
    prove that group is the universal cover: the projection to GL+(2,R) is
    not shown surjective, the fibre is not shown to be Z, and simple
    connectedness is not addressed. The name states the intended object; the
    proved content is strictly the group law plus nonemptiness. Do not cite
    GLTilde as a formalized universal cover.

    GroupAction/QuotAutAction.lean defines AutQuot C as the quotient of
    triangulated auto-equivalences by a setoid asking for Phi.functor iso
    Psi.functor AND Phi.inverse iso Psi.inverse. Mathematically the second
    follows from the first, since adjoints are unique up to natural
    isomorphism -- but that is NOT proved here. So as stated the relation is a
    priori FINER than "the functors are naturally isomorphic", and AutQuot C is
    a priori LARGER than the usual Aut(D). Carrying both components keeps the
    comp/symm compatibility proofs trivial; closing the gap means importing
    adjoint uniqueness and dropping the second component. Until then, read
    AutQuot as "triangulated auto-equivalences modulo a relation at least as
    fine as natural isomorphism" -- not as literally Aut(D). Every statement
    proved about AutQuot holds; what is unproved is that AutQuot equals the
    object the name suggests.

