# Trust record for BridgelandStabLean.
#
# Schema FOLLOWS mattrobball/BridgelandStability's formalization.yaml: same
# top-level blocks, same key names, same intent. It is NOT a key-for-key
# mirror, and a single parser does NOT read both without a shim. The known
# divergences, as of 2026-08-04:
#
#   - the anchor's first key, `schema_version`, is absent here;
#   - `dependencies` is a list of mappings here, a list of strings there;
#   - `human_review` is a scalar here, a list of mappings there;
#   - `machine_review` and `source_mapping` are scalars here, mappings there;
#   - `funding`, `sorry_in_definitions`, and `upstream_prs`/`reviews` differ
#     in type or presence.
#
# Do not rename keys to taste. Closing these divergences is tracked as
# .claude/roadmap/contract-v1.yaml -> contract-v1-e1 (GitHub #13).
#
# Every field is a claim. If a field cannot be filled honestly, it says
# "none" or "pending" -- never a flattering guess.

artifact:
  name: BridgelandStabLean
  url: https://github.com/chris-dare-dev/bridgeland-stab-lean
  description: >
    Extensions to mattrobball/BridgelandStability along two lanes that require
    no algebraic-geometry substrate: rank-2 torsion-free lattice arithmetic,
    and the Bridgeland 2007 section 8 GL+(2,R)-tilde action the anchor does
    not cover.
  date: 2026-08-03
  authors:
    - Chris Dare
  license: MIT
  organization: personal
  funding: none
  contribution_target: none
  maintenance: active

source:
  title: "Stability conditions on triangulated categories (section 8)"
  authors:
    - Tom Bridgeland
  # Versioned deliberately. An unversioned arXiv id resolves to whatever is
  # latest at fetch time, which makes every downstream quote hash a claim about
  # an unidentified document. Confirmed by the owner on 2026-08-03, not
  # inferred: the arXMCP corpus records `arxiv_version = ''` for every row in
  # every notebook, so nothing on this machine knows which version it holds.
  #
  # arxiv.org/abs/math/0212237 has three versions -- v1 (2002-12-17),
  # v2 (2003-05-02), v3 (2006-02-08). v3 is both the latest and the one the
  # corpus almost certainly holds, since notebook_fetch pulls ar5iv for the
  # bare id. It is also the version closest to the published Annals paper
  # (2007), which is where section 8's identity as the group-action section
  # comes from.
  #
  # STILL UNVERIFIED, and it is the corpus's fault, not this record's: nothing
  # on this machine can confirm which version the ingested chunks came from,
  # because the column that would say is empty for every row. Until GitHub #44
  # backfills arxiv_version, a quote match against the corpus is a match
  # against a probable-but-unconfirmed v3. Do not upgrade that to "confirmed"
  # on the strength of a hash match alone.
  id: math/0212237v3
  type: arXiv
  license: arXiv perpetual non-exclusive
  author_contacted: false
  prior_formalization: >
    mattrobball/BridgelandStability covers sections 2-7 of the same paper.
    Section 8 is outside its stated scope. NOTE: that scope statement reads
    "covers Sections 2-7"; the absence of section 8 is an INFERENCE from it,
    not a sentence any upstream source asserts. Section 8's identity as the
    group-action section comes from Bridgeland 2007's own table of contents.
  size_bytes: null

