  source_mapping: >
    Lattice/ maps to no single paper section: it is the rank-2 torsion-free
    arithmetic underlying the Enriques-Kuznetsov article's section 8.4-8.6
    numerical steps. GroupAction/ targets Bridgeland 2007 section 8 (Lemma 8.2
    and the autoequivalence action). It now contains: NormalizedShift, the
    group of +1-equivariant order isomorphisms of R (step 1); and GLTilde,
    Bridgeland's concrete presentation of GL+(2,R)-tilde as pairs (T, f) of a
    positive-determinant matrix and a normalized shift agreeing on the circle
    of phases, proved to be a group under componentwise multiplication with
    both projections group homs (step 2); ComplexBridge, reconciling the
    anchor's C-valued central charge with GLTilde's action on Fin 2 -> R
    (step 3 groundwork); and SlicingAction, the MulAction of NormalizedShift
    (and hence of GLTilde, via toShiftHom) on the anchor's Slicing C by phase
    relabelling, with one_smul and mul_smul proved (step 3a); and
    PreStabilityAction, where BOTH factors act at once -- the shift relabels
    the slicing and the matrix transforms the central charge -- giving
    MulAction GLTilde (PreStabilityCondition.WithClassMap C v) with both laws
    proved (step 3b). The compat' obligation is what forces the two factors to
    agree, and it is discharged by Compatible: a semistable object's charge
    ray moves from phase f-inverse phi to phase phi, with the positive scalar
    m replaced by m * r. ShiftAnalysis proves a normalized shift is UNIFORMLY
    continuous (not automatic for a continuous bijection of R; it follows from
    map_add_one via integer translation and a modulus on a compact window),
    with exists_radius as the consumable form, and SlicingAction adds
    relabel_intervalProp: interval subcategories are reindexed exactly, as an
    equality of ObjectProperty. Those two, plus the anchor's own
    interval_thinFiniteLength_of_inclusion_strict, give relabel_isLocallyFinite
    and hence StabilityAction: MulAction GLTilde
    (StabilityCondition.WithClassMap C v), both laws proved (step 3c).

    The GL+(2,R)-tilde half of Bridgeland section 8 is therefore complete on
    stability conditions.

    GLTildeFibre and GLTildeSurj close the algebraic covering data: deckHom is
    injective with range ker(toMatHom), kerEquiv identifies the kernel with Z,
    toMatHom is surjective, and exact_deckHom_toMatHom packages the exact
    sequence. GLTildeSurj also supplies the explicit canonical lift/section
    and unique deck-times-section factorization. These are group statements,
    not by themselves a covering-space theorem.

    GLTildeTopology (committed and merged 2026-08-06) adds the source topology.
    Its global coordinates are
    R x (0,infinity) x R x (0,infinity), obtained by rotating the first column
    back through f(0) and reading the resulting positive-diagonal
    upper-triangular matrix. The coordinate equivalence is upgraded to a
    homeomorphism; its transported topology makes GLTilde contractible and
    simply connected, and the matrix projection is continuous. GLTildeCover
    adds S^1 x (0,infinity) x R x (0,infinity) coordinates on GL+(2,R), proves
    the projection is the standard exponential cover times an identity in
    those coordinates, and packages the covering-map, surjectivity, and
    simply-connected source properties in GLTilde.universalCoverData.
    GLTildeTopologicalGroup proves joint phase evaluation, multiplication, and
    inversion continuous, yielding IsTopologicalGroup GLTilde.

    ForMathlib/PolarDecomposition proves existence and uniqueness of the polar
    decomposition A = Q P for invertible matrices over RCLike scalars. It was
    added while investigating the topological route, but the final global
    coordinate proof above does not depend on it.

    AutAction, StrictAutAction, QuotAutAction, AutStabilityAction, and
    AutPairAction cover the other half of section 8 -- the autoequivalence
    action -- through full stability conditions.

    AutAction is the groundwork: PostnikovTower.mapF and HNFiltration.mapF push
    a tower / filtration through a triangulated functor, and Slicing.mapEquiv
    transports a slicing along a triangulated auto-equivalence --
    (Phi . s).P phi X = s.P phi (Phi-inverse X), dual to relabel, which moves
    phases and fixes objects. The anchor has NO functor transport of its own,
    only HNFiltration.ofIso along an object isomorphism, so these are built
    from scratch.

    The packaging problem is that C equiv C is associative only up to natural
    isomorphism, so it carries no Group instance. TWO answers are declared,
    and they are NOT interchangeable -- the difference is a scope claim, not
    a style choice.

    StrictAutAction takes a group mapping STRICTLY into endofunctors (functor
    composition in Lean is honestly associative, so C functor C is a monoid
    under composition), giving MulAction G (Slicing C) with no coherence
    bookkeeping. RESTRICTION, and it is a real one: map_one and map_mul are
    EQUALITIES of functors, so F g composed with F g-inverse is the identity on
    the nose -- each F g is an isomorphism of categories, not merely an
    equivalence. Serre functors and spherical twists satisfy that only up to
    natural isomorphism and are therefore OUT OF SCOPE, which is most of the
    autoequivalences one actually wants downstream. This was an explicit owner
    decision (2026-08-03) to take a strict subgroup rather than quotient. Do
    not cite StrictAut as "the Aut action is formalized".

    QuotAutAction does the general thing instead: TriEquiv bundles a
    triangulated auto-equivalence with its instances, and AutQuot C is the
    quotient by natural isomorphism of the forward functors -- a genuine Group, with
    MulAction (AutQuot C) (Slicing C) and both laws proved. NOTHING is
    excluded; every triangulated auto-equivalence has a class in it, Serre
    functors and spherical twists included. The action descends by act_congr:
    if Phi-inverse is naturally isomorphic to Psi-inverse then s.P phi
    (Phi-inverse X) and s.P phi (Psi-inverse X) are equivalent PROPOSITIONS,
    because a slicing's P is closed under isomorphism, and propext makes them
    equal. So closedUnderIso -- an axiom of Slicing that reads like bookkeeping
    -- is exactly what makes the quotient action well defined. The inverse
    natural isomorphism is derived from the forward one by uniqueness of right
    adjoints (`TriEquiv.inverseIsoOfFunctorIso`).

    K0Functor.lean supplies K0 functoriality -- K0.mapF for a triangulated
    functor, with mapF_id, mapF_comp, and mapF_congr (naturally isomorphic
    functors induce the SAME map, the K0-level analogue of TriEquiv.act_congr
    and what lets the class-map half descend to the quotient). It was nearly
    free: X maps to the class of F X is triangle-additive because
    F.map_distinguished carries the triangle and mapTriangle's components are
    definitionally F applied to the originals.

    The class-map compatibility datum is a design choice, not a difficulty:
    pair the autoequivalence with an automorphism of Lambda commuting with v,
    structurally as Compatible does for GLTilde. Landed 2026-08-04 as
    AutPairAction.lean's AutPair/AutPairQuot; note the datum must be an
    AddEquiv there rather than the AddMonoidHom actStabAut takes, because a
    group needs its inverse and v supplies none.

    StrictFiniteLength.lean extracts the general
    strict-hypothesis transfer lemma (isStrictArtinian_of_faithful_strict and
    its Noetherian twin) for an ARBITRARY full faithful strict-mono-preserving
    functor -- the anchor's own two interval lemmas are instances of it -- plus
    mapEquiv_intervalProp_iff, recording that under Aut the interval endpoints
    do NOT move. AutStabilityAction assembles the induced interval functor,
    strict-mono preservation, local finiteness with the same eta, and the
    central-charge compatibility datum. AutPairAction packages this as
    MulAction (AutPairQuot v) (StabilityCondition.WithClassMap C v); the
    lattice datum is an AddEquiv because the acting object is a group.

    CombinedAction proves commutation with GLTilde and supplies the product
    action. TopologicalAction and GLTildeContinuousAction then prove fixed
    elements of both factors and their product act by homeomorphisms.
    GLTildeJointContinuousAction proves the GLTilde action jointly continuous,
    gives AutPairQuot its standard discrete symmetry-group topology, and
    supplies ContinuousSMul for both factors and their product. API details
    are mapped in notes/anchor-api-map.md.

    ComponentAction adds the induced action on connected-component labels,
    component-to-component homeomorphisms, and component-stabilizer actions.
    PeriodMapEquivariance records the induced additive charge transformations
    and equivariance of the global and component-local period coordinates.
    EffectiveAction identifies the categorical `[2]` action with `deck (-1)`,
    proves `(deck 1, [2])` ineffective, and defines the faithful quotient by
    the complete action kernel.

    AutIsometry.lean (2026-08-05) targets the ISOMETRY clause of Lemma 8.2,
    partially. mapEquiv_slicingDist proves the Aut action preserves the
    anchor's slicingDist -- the sup over nonzero objects of the phi-plus and
    phi-minus discrepancies, StabilityCondition/Defs.lean -- exactly, with no
    finiteness hypothesis and with both sides allowed to be infinite.
    actStabAut_slicingDist and AutPairQuot_smul_slicingDist carry it from bare
    slicings to stability conditions and to the MulAction of AutPairQuot v.
    Two supporting lemmas were missing and are stated here for the first time:
    Slicing.phiPlus_congr / phiMinus_congr, the iso-invariance of the intrinsic
    phases, which the anchor inlines at four separate sites in
    Deformation/DeformedGtLe.lean without ever naming; and isZero_functor_iff /
    isZero_inverse_iff, which Functor.map_isZero gives in one direction only.

    The proof does NOT reindex the supremum along Phi, and cannot: Phi.functor
    .obj is a function on the OBJECT TYPE of C, and an equivalence of
    categories makes it injective only up to isomorphism, so there is no Equiv
    to rewrite along. Each side dominates the other pointwise instead, which is
    what forced phiPlus_congr into existence.

    StabilityMass.lean, HNMassUniqueness.lean, StabilityDistance.lean, and
    AutFullIsometry.lean form the subsequent full-metric chain.
    HNFiltration.mass is the finite sum of charge norms for one filtration.
    stabilityMass initially takes the supremum of those sums over every HN
    filtration, avoiding a non-functorial Classical.choice.
    HNFiltration.mass_eq_mass proves the sums are independent of the
    filtration, and stabilityMass_eq_mass identifies the envelope with any of
    them. The mass is finite, positive on nonzero objects, invariant under
    object isomorphism, and transported exactly by AutPair.act. stabilityDist
    is the supremum over nonzero objects of the maximum of phi-plus, phi-minus,
    and the ordinary absolute logarithmic mass discrepancy. It is reflexive,
    symmetric, satisfies the triangle inequality, and dominates slicingDist.
    AutPair.act_stabilityDist and AutPairQuot_smul_stabilityDist prove exact
    invariance of all three coordinates.

    What this is NOT is in known_divergences and must be read before citing it.
  known_divergences: >
    Lattice/NumericalK.lean models K_num(Ku(X)) as the concrete lattice
    Fin 2 -> Z. Every lemma there is a theorem about a rank-2 torsion-free
    lattice, NOT about a Kuznetsov component. The identification is geometry,
    is not expressible in Mathlib today, and is tracked as an unrealized
    assumption -- never discharged in this repo.

    GroupAction/GLTilde.lean defines GLTilde as Bridgeland's pair presentation
    of GL+(2,R)-tilde. The group, surjective projection, Z fibre, explicit
    section, global topology, continuity of the projection, contractibility,
    simple connectedness, covering-map property, and topological-group
    compatibility are now proved.
    GLTilde.universalCoverData packages the covering-map, surjectivity, and
    simply-connected source properties; exact_deckHom_toMatHom separately
    supplies the deck group. GLTilde.isTopologicalGroup packages continuous
    multiplication and inversion. Mathlib has no single bundled
    universal-cover predicate at this pin, so these exact declarations are the
    public trust surface rather than an inferred larger API.

    GroupAction/AutIsometry.lean proves preservation of the anchor's phase-only
    slicingDist. StabilityMass.lean, HNMassUniqueness.lean, and
    StabilityDistance.lean now supply a literal finite HN-mass coordinate and
    AutFullIsometry.lean proves that AutPairQuot v preserves the resulting
    stabilityDist exactly.

    The mass coordinate is now Bridgeland's ordinary HN mass:
    HNFiltration.mass_eq_mass proves independence of the filtration, and
    stabilityMass_eq_mass plus stabilityMass_ne_top identify the choice-free
    envelope with the expected finite sum. logMassDist retains a total
    definition on ENNReal, but massDist_eq_abs_log proves that stability
    conditions always use its ordinary finite absolute-logarithmic branch.

    Proposition 8.1 also asserts separation and equality of the induced
    topology with Section 6. StabilityDistanceSeparation.lean proves
    separation for the ordinary K0-valued space and, more generally, for a
    surjective class map. Without surjectivity it proves precisely the
    observable conclusion: equality of the slicing and Z.comp v.
    StabilityDistanceTopology.lean proves the analytic estimates and forward
    cofinality direction, and proves reverse cofinality plus the compatible
    EMetricSpace construction conditional on StabilityMassTriangleInequality.
    Its ofEDistOfTopology route retains the Section 6 topology definitionally,
    so no raw metric instance or topology diamond is present. The remaining
    filtration-assembly theorem is not assumed and is not hidden in an
    instance; hence the registry relation to Proposition 8.1 is still
    no_claim. The relation of the full-distance isometry to Lemma 8.2 also
    remains no_claim because the acting group has not been identified with
    bare Aut(D).

    StabilityMassTriangle.lean closes the norm-theoretic and semistable-middle
    base cases and the arbitrary-left filtration assembly. In particular,
    defining StabilityMassBoundaryHeartInequality,
    StabilityMassSemistableLeftTriangleInequality, and
    StabilityMassHeartShortExactInequality records proof targets; it does not
    supply terms of those propositions. The phase-one boundary-heart polygon
    argument and the semistable-left cohomological reduction remain open. The
    theorem stabilityMassTriangleInequality_of_semistable_obj₁ proves that
    the latter, once supplied, implies the unconditional global triangle
    proposition by head--tail octahedral induction.

    HNPolygon.lean supplies the next algebraic/geometric layer: the convex
    hull of subobject charges, the HN filtration path inside it, exact
    edge-charge and length/mass identities, and the endpoint chord bound.
    H0ExactnessBridge.lean supplies the exact cohomological interface:
    heart-source exactness iff the canonical cokernel comparison is monic,
    with local consequences from homological H0 or H0-prime. Neither file
    hides the remaining extremality or homologicality theorem in an instance.

    Independently, AutPairQuot v is not Aut(D): it includes a compatible
    lattice automorphism and is not proved equivalent to the external group of
    exact autoequivalences. Do not cite AutPairQuot_smul_stabilityDist as the
    literal paper theorem; call it full-distance invariance for the compatible
    autoequivalence group and state the remaining group-level boundary.

    GroupAction/QuotAutAction.lean defines AutQuot C as the quotient of
    triangulated auto-equivalences by natural isomorphism of the forward
    functors. Inverse natural isomorphisms are derived from uniqueness of right
    adjoints. No separate external object named Aut(D) is identified with this
    quotient, so citations should still name AutQuot C rather than silently
    substitute an external definition.

    The topological action result now includes both levels: each fixed
    GLTilde, AutPairQuot, or direct-product element acts by a homeomorphism,
    and the action maps are jointly continuous. The AutPairQuot factor uses
    the discrete topology; this does not identify it with any independently
    topologized external group of autoequivalences.

    EffectiveCombinedSymmetry is the quotient by the full kernel of the
    combined action, not by a subgroup merely asserted to be generated by the
    deck/double-shift overlap. The explicit pair `(deck 1, [2])` is proved to
    lie in that kernel, with `[2]` acting as `deck (-1)` under this project's
    left-action conventions. Equality of the full kernel with the cyclic
    subgroup it generates is not claimed.

