# Trust record for BridgelandStabLean.
#
# Schema FOLLOWS mattrobball/BridgelandStability's formalization.yaml: same
# top-level blocks, same key names, same intent. It is NOT a key-for-key
# mirror, and a single parser does NOT read both without a shim. The known
# divergences, as of 2026-08-04:
#
#   - the anchor's first key, `schema_version`, is absent here;
#   - `dependencies` is a list of mappings here, a list of strings there;
#   - `human_review` is a scalar here, a list of mappings there;
#   - `machine_review` and `source_mapping` are scalars here, mappings there;
#   - `funding`, `sorry_in_definitions`, and `upstream_prs`/`reviews` differ
#     in type or presence.
#
# Do not rename keys to taste. Closing these divergences is tracked as
# .claude/roadmap/contract-v1.yaml -> contract-v1-e1 (GitHub #13).
#
# Every field is a claim. If a field cannot be filled honestly, it says
# "none" or "pending" -- never a flattering guess.

artifact:
  name: BridgelandStabLean
  url: https://github.com/chris-dare-dev/bridgeland-stab-lean
  description: >
    Extensions to mattrobball/BridgelandStability along two lanes that require
    no algebraic-geometry substrate: rank-2 torsion-free lattice arithmetic,
    and the Bridgeland 2007 section 8 GL+(2,R)-tilde action the anchor does
    not cover.
  date: 2026-08-03
  authors:
    - Chris Dare
  license: Apache-2.0
  organization: personal
  funding: none
  contribution_target: none
  maintenance: active

source:
  title: "Stability conditions on triangulated categories (section 8)"
  authors:
    - Tom Bridgeland
  # Versioned deliberately. An unversioned arXiv id resolves to whatever is
  # latest at fetch time, which makes every downstream quote hash a claim about
  # an unidentified document. Confirmed by the owner on 2026-08-03, not
  # inferred: the arXMCP corpus records `arxiv_version = ''` for every row in
  # every notebook, so nothing on this machine knows which version it holds.
  #
  # arxiv.org/abs/math/0212237 has three versions -- v1 (2002-12-17),
  # v2 (2003-05-02), v3 (2006-02-08). v3 is both the latest and the one the
  # corpus almost certainly holds, since notebook_fetch pulls ar5iv for the
  # bare id. It is also the version closest to the published Annals paper
  # (2007), which is where section 8's identity as the group-action section
  # comes from.
  #
  # STILL UNVERIFIED, and it is the corpus's fault, not this record's: nothing
  # on this machine can confirm which version the ingested chunks came from,
  # because the column that would say is empty for every row. Until GitHub #44
  # backfills arxiv_version, a quote match against the corpus is a match
  # against a probable-but-unconfirmed v3. Do not upgrade that to "confirmed"
  # on the strength of a hash match alone.
  id: math/0212237v3
  type: arXiv
  license: arXiv perpetual non-exclusive
  author_contacted: false
  prior_formalization: >
    mattrobball/BridgelandStability covers sections 2-7 of the same paper.
    Section 8 is outside its stated scope. NOTE: that scope statement reads
    "covers Sections 2-7"; the absence of section 8 is an INFERENCE from it,
    not a sentence any upstream source asserts. Section 8's identity as the
    group-action section comes from Bridgeland 2007's own table of contents.
  size_bytes: null

toolchain:
  system: Lean 4
  system_version: v4.29.0
  dependencies:
    - name: BridgelandStability
      rev: 9e48f23a382ba117b63076a33e0e775389fef1ba
      date: 2026-04-21
    - name: mathlib
      rev: 8a178386ffc0f5fef0b77738bb5449d50efeea95
      note: transitive via BridgelandStability; not pinned separately
  build_manifest_url: https://github.com/chris-dare-dev/bridgeland-stab-lean/blob/main/lake-manifest.json

automation:
  method: AI-assisted
  framework: Claude Code
  models:
    - claude-opus-5

cost:
  wall_time: pending
  compute_time: pending
  person_hours: pending
  api_spend: pending
  hardware: Windows 11 workstation
  includes_failures: true

fidelity:
  sorry_count: 0
  sorry_in_definitions: false
  sorry_details: >
    None. The NormalizedShift group structure is PROVED, not asserted: it was
    left undeclared in the initial skeleton and closed on 2026-08-03. The
    standing rule stays -- a result that is not yet proved is left undeclared
    with a TODO, never declared with sorry, because a sorry-backed instance
    typechecks, gets imported, and launders an unproved claim downstream.
    Currently undeclared under that rule: the covering-space facts about
    GLTilde -- surjectivity of the projection to GL+(2,R), fibre Z, simple
    connectedness -- and the autoequivalence (Aut) action on STABILITY
    CONDITIONS.

    The Aut action on SLICINGS is landed, and generally: AutAction.lean is the
    transport groundwork (PostnikovTower.mapF, HNFiltration.mapF,
    Slicing.mapEquiv), and QuotAutAction.lean quotients triangulated
    auto-equivalences by natural isomorphism to get an honest Group AutQuot C
    with MulAction (AutQuot C) (Slicing C), both laws proved and nothing
    excluded. StrictAutAction.lean remains as the cheaper strict route; it is
    SUPERSEDED for slicings and carries a scope restriction recorded in
    source_mapping -- its F g are isomorphisms of categories, not merely
    equivalences, so Serre functors and spherical twists are outside it. Do not
    cite StrictAut as "the Aut action is formalized"; cite AutQuot, subject to
    the setoid gap in known_divergences.

    What is undeclared is the action on WithClassMap, which needs K0
    functoriality, a class-map compatibility datum, and invariance of strict
    finite length under an equivalence of interval categories. See
    notes/anchor-api-map.md section 7.

    CORRECTION (2026-08-03): an earlier revision of this field recorded step 3c
    as BLOCKED on a strict-finite-length restriction lemma said to be absent
    from the anchor. That was wrong. The lemma is
    interval_thinFiniteLength_of_inclusion_strict, at
    Deformation/IntervalSelection.lean:354, stated for two different slicings.
    The search behind the earlier claim covered IntervalCategory/ and
    QuasiAbelian/ but not Deformation/. Step 3c was never blocked and is now
    closed.

    Closed on 2026-08-03: the GL+(2,R) pairing (step 2), the action on Slicing
    (step 3a), the action on PreStabilityCondition.WithClassMap (step 3b), and
    the action on StabilityCondition.WithClassMap (step 3c).
  axiom_count: 0
  axiom_details: >
    No axiom declarations. Transitive closure enumerated 2026-08-03 via
    `lake env lean scripts/Audit.lean` over all 105 declarations this project
    introduces: every one depends on exactly [propext, Classical.choice,
    Quot.sound] and nothing else. No sorryAx. Allowlist verdict: pass.
    The same script carries rfl/simp spot checks that the Group instance
    computes the intended composition, not merely some group structure that
    typechecks. Re-run it before editing this block.
  builds_clean: true
  builds_clean_date: 2026-08-03
  human_review: none
  machine_review: >
    lake build (3544 jobs, exit 0). Since 2026-08-03 the #print axioms pass is
    a BUILD TARGET, not a separate manual step: scripts/Audit.lean is covered
    by `[[lean_lib]] name = "Audit"` (srcDir = "scripts") and is in
    defaultTargets, so `lake build` elaborates it and its 90 audit records are
    build output. The anchor itself was also built from source for the first
    time (74 files, exit 0) -- it is not covered by Mathlib's cache and nothing
    had imported it until the step-3 API read.

    The 90 records were re-parsed from the build log on 2026-08-03 and every
    one is a subset of [propext, Classical.choice, Quot.sound]; the distinct
    axiom set across all 90 is exactly those three; sorryAx does not appear
    anywhere in the log. Parsing them is fiddly enough to be worth recording,
    because the two obvious ways to check are both WRONG: the axiom list wraps
    across lines (8 records wrap here), so a line-oriented grep under-reads it;
    and the declaration name is quote-delimited while two names END in an
    apostrophe (NormalizedShift.ext', GLTilde.ext'), so a naive quoted-name
    regex silently drops exactly those two. A checker that reports 88 of 90 and
    calls it clean is the failure mode to watch for. This is a symptom, not a
    quirk: prose output is the wrong interface, which is why the emitter
    (contract-v1-e4) replaces it with JSON.

    Bringing the audit into the build immediately caught rot the manual
    workflow could not: the SlicingChecks section did not compile under this
    package's own `[leanOptions] autoImplicit = false`. It had only ever been
    run via `lake env lean`, which does not apply the package's leanOptions, so
    the universe variables `u` and `v` were auto-bound and the section
    elaborated by accident. Fixed by an explicit `universe u v`.

    Being in the build is still NOT a gate. `#print axioms` prints its result
    and exits 0, so a sorryAx-backed declaration would build green here; the
    allowlist verdict above comes from reading the output, not from the exit
    code. A real gate requires an emitter that sweeps Environment.constants
    (.claude/roadmap/contract-v1.yaml -> contract-v1-e4).

    No human has reviewed any statement for faithfulness to a source.
  source_mapping: >
    Lattice/ maps to no single paper section: it is the rank-2 torsion-free
    arithmetic underlying the Enriques-Kuznetsov article's section 8.4-8.6
    numerical steps. GroupAction/ targets Bridgeland 2007 section 8 (Lemma 8.2
    and the autoequivalence action). It now contains: NormalizedShift, the
    group of +1-equivariant order isomorphisms of R (step 1); and GLTilde,
    Bridgeland's concrete presentation of GL+(2,R)-tilde as pairs (T, f) of a
    positive-determinant matrix and a normalized shift agreeing on the circle
    of phases, proved to be a group under componentwise multiplication with
    both projections group homs (step 2); ComplexBridge, reconciling the
    anchor's C-valued central charge with GLTilde's action on Fin 2 -> R
    (step 3 groundwork); and SlicingAction, the MulAction of NormalizedShift
    (and hence of GLTilde, via toShiftHom) on the anchor's Slicing C by phase
    relabelling, with one_smul and mul_smul proved (step 3a); and
    PreStabilityAction, where BOTH factors act at once -- the shift relabels
    the slicing and the matrix transforms the central charge -- giving
    MulAction GLTilde (PreStabilityCondition.WithClassMap C v) with both laws
    proved (step 3b). The compat' obligation is what forces the two factors to
    agree, and it is discharged by Compatible: a semistable object's charge
    ray moves from phase f-inverse phi to phase phi, with the positive scalar
    m replaced by m * r. ShiftAnalysis proves a normalized shift is UNIFORMLY
    continuous (not automatic for a continuous bijection of R; it follows from
    map_add_one via integer translation and a modulus on a compact window),
    with exists_radius as the consumable form, and SlicingAction adds
    relabel_intervalProp: interval subcategories are reindexed exactly, as an
    equality of ObjectProperty. Those two, plus the anchor's own
    interval_thinFiniteLength_of_inclusion_strict, give relabel_isLocallyFinite
    and hence StabilityAction: MulAction GLTilde
    (StabilityCondition.WithClassMap C v), both laws proved (step 3c).

    The GL+(2,R)-tilde half of Bridgeland section 8 is therefore complete on
    stability conditions.

    AutAction, StrictAutAction, and QuotAutAction cover the other half of
    section 8 -- the autoequivalence action -- on SLICINGS only.

    AutAction is the groundwork: PostnikovTower.mapF and HNFiltration.mapF push
    a tower / filtration through a triangulated functor, and Slicing.mapEquiv
    transports a slicing along a triangulated auto-equivalence --
    (Phi . s).P phi X = s.P phi (Phi-inverse X), dual to relabel, which moves
    phases and fixes objects. The anchor has NO functor transport of its own,
    only HNFiltration.ofIso along an object isomorphism, so these are built
    from scratch.

    The packaging problem is that Aut(D) is not a group in Lean: C equiv C is
    associative only up to natural isomorphism, so it carries no Group instance
    and MulAction is unavailable. TWO answers are declared, and they are NOT
    interchangeable -- the difference is a scope claim, not a style choice.

    StrictAutAction takes a group mapping STRICTLY into endofunctors (functor
    composition in Lean is honestly associative, so C functor C is a monoid
    under composition), giving MulAction G (Slicing C) with no coherence
    bookkeeping. RESTRICTION, and it is a real one: map_one and map_mul are
    EQUALITIES of functors, so F g composed with F g-inverse is the identity on
    the nose -- each F g is an isomorphism of categories, not merely an
    equivalence. Serre functors and spherical twists satisfy that only up to
    natural isomorphism and are therefore OUT OF SCOPE, which is most of the
    autoequivalences one actually wants downstream. This was an explicit owner
    decision (2026-08-03) to take a strict subgroup rather than quotient. Do
    not cite StrictAut as "the Aut action is formalized".

    QuotAutAction does the general thing instead: TriEquiv bundles a
    triangulated auto-equivalence with its instances, and AutQuot C is the
    quotient by natural isomorphism -- a genuine Group, with
    MulAction (AutQuot C) (Slicing C) and both laws proved. NOTHING is
    excluded; every triangulated auto-equivalence has a class in it, Serre
    functors and spherical twists included. The action descends by act_congr:
    if Phi-inverse is naturally isomorphic to Psi-inverse then s.P phi
    (Phi-inverse X) and s.P phi (Psi-inverse X) are equivalent PROPOSITIONS,
    because a slicing's P is closed under isomorphism, and propext makes them
    equal. So closedUnderIso -- an axiom of Slicing that reads like bookkeeping
    -- is exactly what makes the quotient action well defined. One gap in the
    setoid is recorded in known_divergences.

    NOT declared on either route: the Aut action on STABILITY CONDITIONS. That
    needs K0 functoriality, a class-map compatibility datum, and invariance of
    strict finite length under an EQUIVALENCE of interval categories -- a
    different problem from step 3c, where phase windows do not move and the
    anchor's interval_thinFiniteLength_of_inclusion_strict applies. Also not
    covered: the covering-space identification of GLTilde (see
    known_divergences). API mapped in notes/anchor-api-map.md.
  known_divergences: >
    Lattice/NumericalK.lean models K_num(Ku(X)) as the concrete lattice
    Fin 2 -> Z. Every lemma there is a theorem about a rank-2 torsion-free
    lattice, NOT about a Kuznetsov component. The identification is geometry,
    is not expressible in Mathlib today, and is tracked as an unrealized
    assumption -- never discharged in this repo.

    GroupAction/GLTilde.lean defines GLTilde as Bridgeland's pair
    presentation of GL+(2,R)-tilde and proves it is a GROUP. It does NOT
    prove that group is the universal cover: the projection to GL+(2,R) is
    not shown surjective, the fibre is not shown to be Z, and simple
    connectedness is not addressed. The name states the intended object; the
    proved content is strictly the group law plus nonemptiness. Do not cite
    GLTilde as a formalized universal cover.

    GroupAction/QuotAutAction.lean defines AutQuot C as the quotient of
    triangulated auto-equivalences by a setoid asking for Phi.functor iso
    Psi.functor AND Phi.inverse iso Psi.inverse. Mathematically the second
    follows from the first, since adjoints are unique up to natural
    isomorphism -- but that is NOT proved here. So as stated the relation is a
    priori FINER than "the functors are naturally isomorphic", and AutQuot C is
    a priori LARGER than the usual Aut(D). Carrying both components keeps the
    comp/symm compatibility proofs trivial; closing the gap means importing
    adjoint uniqueness and dropping the second component. Until then, read
    AutQuot as "triangulated auto-equivalences modulo a relation at least as
    fine as natural isomorphism" -- not as literally Aut(D). Every statement
    proved about AutQuot holds; what is unproved is that AutQuot equals the
    object the name suggests.

